name: "Integration Test"
# Manual only: deploys to a real project with a repository secret. It used to run on
# pull_request_target (secrets available to PR-triggered runs) against a project this
# repository's service account can no longer deploy to, so it failed on every PR.
on:
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.10.1"

jobs:
  deploy_cloud_function:
    runs-on: ubuntu-latest
    name: Deploy code to Cloud Function
    steps:
      # To use this repository's private action,
      # you must check out the repository
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deploy code to Cloud Function
        uses: ./ # Uses an action in the root directory
        env:
          gcp_project: "wf-gcp-us-ae-buyfair-dev"
          gcp_region: "us-central1"
          cloud_function_name: "test_cloud_function"
          cloud_function_directory: "functions/test_cloud_function"
          credentials: ${{ secrets.GCP_SERVICE_ACCOUNT }}
